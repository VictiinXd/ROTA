<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteirizador Campinas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sans: 'IBM Plex Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  --bg: #f4f3ef;
  --white: #ffffff;
  --border: #e0ddd7;
  --text: #18181b;
  --muted: #71717a;
  --c1: #2563eb;
  --c2: #ea580c;
  --HDR: 50px;
  --PNL: 420px;
}
html, body { height: 100%; overflow: hidden; font-family: var(--sans); background: var(--bg); color: var(--text); }

/* HEADER */
#hdr {
  position: fixed; top: 0; left: 0; right: 0; height: var(--HDR); z-index: 1000;
  background: #18181b; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; gap: 1rem;
}
.logo { font-family: var(--mono); font-size: .85rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: .5rem; }
.pill { font-size: .68rem; padding: .15rem .45rem; border-radius: 2px; font-weight: 700; border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.5); cursor: pointer; background: transparent; font-family: var(--mono); }
.pill.c1 { background: var(--c1); border-color: var(--c1); color: #fff; }
.pill.c2 { background: var(--c2); border-color: var(--c2); color: #fff; }
#hdr-mid { font-family: var(--mono); font-size: .68rem; color: rgba(255,255,255,.35); }
.hbtn { font-family: var(--mono); font-size: .68rem; padding: .24rem .6rem; border-radius: 2px; cursor: pointer; border: 1px solid rgba(255,255,255,.2); background: transparent; color: rgba(255,255,255,.6); }
.hbtn:hover { color: #fff; border-color: rgba(255,255,255,.5); }
.hbtn.wh { background: #fff; color: #18181b; border-color: #fff; }
.hbtn.rd { border-color: #f87171; color: #f87171; }
.hbtn.rd:hover { background: #ef4444; border-color: #ef4444; color: #fff; }
#spin-wrap { display: none; font-family: var(--mono); font-size: .68rem; color: rgba(255,255,255,.4); align-items: center; gap: .3rem; }
#spin-wrap.on { display: flex; }
.spin { display: inline-block; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* PANEL */
#panel {
  position: fixed; top: var(--HDR); left: 0; bottom: 0; width: var(--PNL);
  background: var(--white); border-right: 1px solid var(--border); z-index: 99;
}

/* TABS */
#tabs { position: fixed; top: var(--HDR); left: 0; width: var(--PNL); height: 36px; display: flex; border-bottom: 1px solid var(--border); background: var(--white); z-index: 100; }
.tab { flex: 1; padding: .5rem; font-family: var(--mono); font-size: .65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: none;
  background: transparent; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--text); }
.tab:disabled { opacity: .3; cursor: not-allowed; }

/* PANE 1 */
#pane1 { position: fixed; top: 86px; left: 0; width: var(--PNL); bottom: 0; overflow-y: auto; display: flex; flex-direction: column; padding: .9rem; gap: .65rem; background: var(--white); z-index: 99; }
.lbl { font-family: var(--mono); font-size: .65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; align-items: center; }
#addr-input {
  flex: 1; min-height: 220px; resize: vertical; padding: .65rem; border: 1px solid var(--border);
  border-radius: 3px; font-family: var(--mono); font-size: .75rem; line-height: 1.8;
  background: #fafaf8; color: var(--text); outline: none;
}
#addr-input:focus { border-color: var(--text); background: #fff; }
#addr-input::placeholder { color: #bbb; }
#preview { display: flex; flex-direction: column; gap: .18rem; }
.pv-item { display: flex; align-items: center; gap: .38rem; padding: .25rem .4rem; border-radius: 2px; font-size: .72rem; border: 1px solid var(--border); background: #fafaf8; }
.pv-item.ok { border-color: #bbf7d0; }
.pv-item.err { border-color: #fecaca; background: #fff5f5; }
.pv-n { font-family: var(--mono); font-size: .58rem; color: var(--muted); min-width: 16px; }
.pv-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-st { font-family: var(--mono); font-size: .58rem; }
.ok .pv-st { color: #16a34a; } .err .pv-st { color: #dc2626; }
#btn-proc { width: 100%; padding: .55rem; border-radius: 3px; font-family: var(--mono); font-size: .76rem; font-weight: 700; cursor: pointer; border: none; background: var(--text); color: var(--bg); text-transform: uppercase; letter-spacing: .02em; flex-shrink: 0; }
#btn-proc:disabled { opacity: .35; cursor: not-allowed; }
#btn-proc:not(:disabled):hover { background: #333; }

/* PANE 2 */
#pane2 { display: block; }
#ctrl { position: fixed; top: 86px; left: 0; width: var(--PNL); height: 86px; padding: .75rem; border-bottom: 1px solid var(--border); background: var(--white); display: flex; flex-direction: column; gap: .5rem; z-index: 100; }
.crow { display: flex; gap: .38rem; align-items: center; }
.clbl { font-family: var(--mono); font-size: .63rem; font-weight: 700; color: var(--muted); text-transform: uppercase; min-width: 78px; }
#n-routes { width: 48px; padding: .24rem .35rem; border: 1px solid var(--border); border-radius: 3px; font-family: var(--mono); font-size: .78rem; font-weight: 700; text-align: center; background: #fafaf8; color: var(--text); outline: none; }
#n-routes:focus { border-color: var(--text); }
.bgen { flex: 1; padding: .28rem .55rem; border-radius: 3px; font-family: var(--mono); font-size: .68rem; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-transform: uppercase; }
.bgen:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
#sbar { font-family: var(--mono); font-size: .65rem; color: var(--muted); display: flex; gap: .6rem; }
#sbar b { color: var(--text); }
#spin2 { display: none; font-family: var(--mono); font-size: .65rem; color: var(--muted); }
#spin2.on { display: inline; }

/* ROUTES SCROLL — explicit height so scroll always works */
#rscroll {
  position: fixed;
  top: 172px;
  left: 0;
  width: var(--PNL);
  bottom: 0;
  overflow-y: auto;
  padding: .65rem;
  background: var(--white);
  z-index: 99;
}
#rscroll::-webkit-scrollbar { width: 4px; }
#rscroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ACCORDION CARDS */
.rcard { border: 1px solid var(--border); border-radius: 5px; overflow: hidden; background: var(--white); margin-bottom: .5rem; }
.rcard-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem .7rem; cursor: pointer; user-select: none; border-left: 4px solid transparent;
}
.rcard-hdr:hover { background: #fafaf8; }
.rcard-hl { display: flex; align-items: center; gap: .45rem; flex: 1; min-width: 0; }
.rcard-arrow { font-size: .7rem; color: var(--muted); flex-shrink: 0; transition: transform .2s; }
.rcard.open .rcard-arrow { transform: rotate(0deg); }
.rcard-info { min-width: 0; }
.rcard-name { font-family: var(--mono); font-size: .74rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcard-meta { font-family: var(--mono); font-size: .6rem; color: var(--muted); margin-top: .08rem; }
.rcard-meta b { color: var(--text); }
.maps-btn { padding: .2rem .5rem; border-radius: 2px; font-family: var(--mono); font-size: .6rem; font-weight: 700; cursor: pointer; background: transparent; text-transform: uppercase; flex-shrink: 0; margin-left: .4rem; }
.maps-btn:hover { opacity: .7; }

/* Accordion body — hidden by default, shown when .open */
.rcard-body { display: none; border-top: 1px solid var(--border); }
.rcard.open .rcard-body { display: block; }

/* Stop items */
.stop-list { list-style: none; }
.stop { display: flex; align-items: center; gap: .4rem; padding: .3rem .6rem; border-bottom: 1px solid #f0eeea; cursor: grab; user-select: none; }
.stop:last-child { border-bottom: none; }
.stop:hover { background: #fafaf8; }
.stop.dragging { opacity: .3; }
.stop.dragover { border-top: 2px solid var(--c1); }
.stop-drag { color: #d0ccc6; font-size: .7rem; flex-shrink: 0; }
.stop-num { font-family: var(--mono); font-size: .58rem; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
.stop-name { flex: 1; font-size: .73rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop-dist { font-family: var(--mono); font-size: .58rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.stop-rm { background: none; border: none; color: #d0ccc6; cursor: pointer; font-size: .75rem; flex-shrink: 0; }
.stop-rm:hover { color: #ef4444; }

/* empty */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; color: var(--muted); font-family: var(--mono); font-size: .72rem; text-align: center; padding: 2.5rem 1rem; }
.empty-ico { font-size: 2rem; }

/* MAP */
#map-wrap { position: fixed; top: var(--HDR); left: var(--PNL); right: 0; bottom: 0; }
#map { width: 100%; height: 100%; }
#legend { position: absolute; bottom: 12px; left: 12px; z-index: 500; background: rgba(255,255,255,.95); border: 1px solid var(--border); border-radius: 4px; padding: .4rem .6rem; font-family: var(--mono); font-size: .63rem; display: none; flex-direction: column; gap: .25rem; }
.leg-row { display: flex; align-items: center; gap: .35rem; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* TOAST */
#toast { position: fixed; bottom: 14px; right: 14px; z-index: 9999; background: var(--text); color: var(--bg); font-family: var(--mono); font-size: .7rem; padding: .45rem .8rem; border-radius: 3px; pointer-events: none; opacity: 0; transform: translateY(50px); transition: all .2s ease; }
#toast.on { opacity: 1; transform: translateY(0); }

/* HIDDEN */
.hide { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div class="logo">
    <button class="pill c1" id="pill-c1" onclick="setBase('c1')">C1</button>
    <button class="pill"    id="pill-c2" onclick="setBase('c2')">C2</button>
    <span style="opacity:.25;margin:0 .1rem">|</span>
    ROTEIRIZADOR
  </div>
  <div id="hdr-mid">Cole os endereços e gere as rotas</div>
  <div style="display:flex;gap:.4rem;align-items:center;">
    <div id="spin-wrap"><span class="spin">⟳</span> calculando...</div>
    <button class="hbtn hide" id="btn-back"   onclick="goStep(1)">← Voltar</button>
    <button class="hbtn rd hide" id="btn-reset"  onclick="resetAll()">✕ Resetar</button>
    <button class="hbtn wh hide" id="btn-export" onclick="exportTxt()">↓ Exportar</button>
  </div>
</div>

<!-- PANEL -->
<div id="panel">
  <div id="tabs">
    <button class="tab on" id="tab1" onclick="goStep(1)">① Endereços</button>
    <button class="tab"    id="tab2" disabled onclick="goStep(2)">② Rotas</button>
  </div>

  <!-- PANE 1 -->
  <div id="pane1">
    <div class="lbl">Endereços / Agências <span id="line-count">0 linhas</span></div>
    <textarea id="addr-input" placeholder="BARAO GERALDO
VINHEDO
CAMPINAS
INDAIATUBA
SUMARE
...um por linha"></textarea>
    <div id="preview"></div>
    <button id="btn-proc" disabled onclick="processar()">Processar endereços →</button>
  </div>

  <!-- PANE 2 -->
  <div id="pane2" class="hide">
    <div id="ctrl">
      <div class="crow">
        <span class="clbl">Nº de rotas</span>
        <input type="number" id="n-routes" value="3" min="1" max="8">
        <button class="bgen" onclick="autoRoute()">⊕ Auto região</button>
        <button class="bgen" onclick="splitRoute()">÷ Dividir N</button>
      </div>
      <div class="crow">
        <div id="sbar"><span><b id="s-pts">0</b> pts</span><span><b id="s-rot">0</b> rotas</span><span><b id="s-km">—</b> km</span></div>
        <span id="spin2"><span class="spin">⟳</span></span>
      </div>
    </div>
    <div id="rscroll">
      <div class="empty"><div class="empty-ico">🗺</div><div>Clique em "Auto região" ou "Dividir N"</div></div>
    </div>
  </div>
</div>

<!-- MAP -->
<div id="map-wrap">
  <div id="map"></div>
  <div id="legend"></div>
</div>

<div id="toast"></div>

<script>
// ─── COORDS ───────────────────────────────────────────────────────────────────
const KC = {
  'CAMPINAS':[-22.9056,-47.0608],'BARAO GERALDO':[-22.8178,-47.0578],
  'AMOREIRAS':[-22.8972,-47.0628],'VINHEDO':[-23.0297,-46.9752],
  'VALINHOS':[-22.9736,-46.9961],'INDAIATUBA':[-23.0904,-47.2192],
  'SUMARE':[-22.8219,-47.2669],'AMERICANA':[-22.7390,-47.3320],
  'SANTA BARBARA DO OESTE':[-22.7536,-47.4139],'STA BARBARA DO OESTE':[-22.7536,-47.4139],
  'PAULINIA':[-22.7619,-47.1536],'JAGUARIUNA':[-22.7031,-46.9856],
  'CONCHAL':[-22.3256,-47.1736],'PIRACICABA':[-22.7253,-47.6492],
  'LIMEIRA':[-22.5644,-47.4014],'ARARAS':[-22.3572,-47.3836],
  'LEME':[-22.1878,-47.3906],'CORDEIROPOLIS':[-22.4778,-47.4575],
  'RIO CLARO':[-22.4117,-47.5608],'AMPARO':[-22.7067,-46.7736],
  'SOCORRO':[-22.5911,-46.5278],'SERRA NEGRA':[-22.6100,-46.7014],
  'MOGI MIRIM':[-22.4319,-46.9578],'AGUAS DE LINDOIA':[-22.4811,-46.6317],
  'AGUAI':[-22.0608,-46.9764],'PIRASSUNUNGA':[-21.9978,-47.4253],
  'SAO PEDRO':[-22.5472,-47.9131],'SANTA MARIA DA SERRA':[-22.5736,-48.1703],
  'ITAPIRA':[-22.4361,-46.8239],'ARTUR NOGUEIRA':[-22.5736,-47.1703],
  'MOGI GUACU':[-22.3719,-46.9403],'M GUACU':[-22.3719,-46.9403],
  'TIETE':[-22.9183,-47.7036],'SOROCABA':[-23.5015,-47.4526],
  'ITU':[-23.2642,-47.2986],'SALTO':[-23.2011,-47.2894],
  'TATUI':[-23.3522,-47.8569],'BOITUVA':[-23.2833,-47.6736],
  'CAJAMAR':[-23.3608,-46.8778],'GUARULHOS':[-23.4628,-46.5333],
  'BOSQUE MAIA':[-23.4556,-46.5431],'MAIRIPORA':[-23.3178,-46.5869],
  'ATIBAIA':[-23.1178,-46.5503],'BRAGANCA PAULISTA':[-22.9519,-46.5419],
  'BRAGANCA PTA':[-22.9519,-46.5419],'ITATIBA':[-23.0058,-46.8386],
  'ITUPEVA':[-23.1536,-47.0597],'CABREUVA':[-23.3119,-47.1336],
  'SANTANA DE PARNAIBA':[-23.4428,-46.9181],'OSASCO':[-23.5328,-46.7919],
  'BARUERI':[-23.5025,-46.8764],'ALPHAVILLE':[-23.4928,-46.8494],
  'ITAPECERICA DA SERRA':[-23.7161,-46.8514],'TABOAO DA SERRA':[-23.6108,-46.7575],
  'VOTORANTIM':[-23.5472,-47.4317],'PIEDADE':[-23.9139,-47.4261],
  'CAPAO BONITO':[-24.0050,-48.3478],'SAO MIGUEL ARCANJO':[-23.8744,-48.1617],
  'MAIRINQUE':[-23.5342,-47.1742],'ITAPETININGA':[-23.5917,-48.0536],
  'IPERO':[-23.3467,-47.6928],'EMBU GUACU':[-23.8328,-46.8133],
  'COTIA':[-23.6033,-46.9194],'FRANCISCO MORATO':[-23.2800,-46.7428],
  'JARINU':[-23.1025,-46.7292],'VARZEA PAULISTA':[-23.2100,-46.8292],
  'JUNDIAI':[-23.1864,-46.8842],'PICANCO':[-23.5106,-46.7442],
  'SAO ROQUE':[-23.5261,-47.1358],'VARGEM GRANDE PAULISTA':[-23.5653,-47.2208],
  'ARACARIGUAMA':[-23.4361,-47.0614],'PORTO FELIZ':[-23.2139,-47.5228],
  'CERQUILHO':[-23.1656,-47.7464],'IBIUNA':[-23.6578,-47.2228],
  'EMBU':[-23.6450,-46.8508],'PARQUE DA UVA':[-23.4628,-46.5333],
};

const COLORS = ['#2563eb','#ea580c','#16a34a','#7c3aed','#0e7490','#b45309','#be185d','#374151'];

// ─── STATE ────────────────────────────────────────────────────────────────────
let base = 'c1';
let pts  = [];    // [{name, coord}]
let rts  = [];    // [{name,color,stops,totalDist,totalTime,legs,geometry}]
let map, layers = [];

// ─── MAP ──────────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map').setView([-22.95, -47.0], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);
}

function clearLayers() {
  layers.forEach(l => map.removeLayer(l));
  layers = [];
}

// ─── COORD RESOLVE ────────────────────────────────────────────────────────────
function resolve(name) {
  const up = name.toUpperCase().trim();
  if (KC[up]) return KC[up];
  // partial match
  for (const [k, v] of Object.entries(KC)) {
    if (up.includes(k) || k.includes(up.split(/[,\-]/)[0].trim())) return v;
  }
  // strip prefixes and try again
  const stripped = up
    .replace(/^(LOJA EXCLUSIVA |LOJA SELECT |PA SHOP INT |PAE |PA |WORK CAFE |SELECT |CENTRO-|JARDIM |PRACA |PLAT MID |R DO TESOURO-|AMOREIRAS-|SUMARE-|PICANCO-|MONSENHOR-|BOSQUE )/i,'')
    .replace(/\s*-\s*(SP|MG|RJ)\s*\d*$/i,'')
    .replace(/\s+(SP|MG|RJ)\s*$/i,'')
    .replace(/\s*INT\s*$/i,'')
    .split(/[\-,]/)[0].trim();
  if (KC[stripped]) return KC[stripped];
  for (const [k, v] of Object.entries(KC)) {
    if (stripped.includes(k) || k.includes(stripped.split(' ')[0]) && stripped.split(' ')[0].length > 4) return v;
  }
  return null;
}

// ─── STEP 1: PROCESSAR ────────────────────────────────────────────────────────
function processar() {
  const raw = document.getElementById('addr-input').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 1);

  pts = lines.map((line, i) => {
    // Strip leading OS number (e.g. "4717878 AGENCIA...")
    const name = line.replace(/^\d{5,10}\s+/, '').trim();
    const coord = resolve(name);
    return { name, coord, ok: !!coord };
  });

  // Render preview
  const prev = document.getElementById('preview');
  prev.innerHTML = pts.map((p, i) =>
    `<div class="pv-item ${p.ok ? 'ok' : 'err'}">
      <span class="pv-n">${i+1}</span>
      <span class="pv-name">${p.name}</span>
      <span class="pv-st">${p.ok ? '✓' : '✗'}</span>
    </div>`
  ).join('');

  const good = pts.filter(p => p.ok);
  if (!good.length) { toast('Nenhum endereço reconhecido'); return; }

  // Map markers
  clearLayers();
  good.forEach(p => {
    const mk = L.circleMarker(p.coord, { radius: 7, fillColor: '#64748b', color: '#fff', weight: 2, fillOpacity: 1 })
      .addTo(map).bindPopup(`<b>${p.name}</b>`);
    layers.push(mk);
  });
  map.fitBounds(L.latLngBounds(good.map(p => p.coord)), { padding: [40,40] });

  // Go to step 2
  goStep(2);
  document.getElementById('s-pts').textContent = good.length;
  document.getElementById('btn-back').classList.remove('hide');
  document.getElementById('btn-reset').classList.remove('hide');
  toast(`${good.length}/${lines.length} endereços localizados`);
}

// ─── STEP NAV ─────────────────────────────────────────────────────────────────
function goStep(n) {
  document.getElementById('pane1').classList.toggle('hide', n !== 1);
  document.getElementById('pane2').classList.toggle('hide', n !== 2);
  document.getElementById('tab1').classList.toggle('on', n === 1);
  document.getElementById('tab2').classList.toggle('on', n === 2);
  document.getElementById('tab2').disabled = pts.length === 0;
  document.getElementById('btn-back').classList.toggle('hide', n === 1);
}

// ─── BASE SWITCH ──────────────────────────────────────────────────────────────
function setBase(b) {
  base = b;
  document.getElementById('pill-c1').className = 'pill' + (b === 'c1' ? ' c1' : '');
  document.getElementById('pill-c2').className = 'pill' + (b === 'c2' ? ' c2' : '');
  map.setView(b === 'c1' ? [-22.9,-47.0] : [-23.4,-46.8], 9);
}

// ─── MATH ─────────────────────────────────────────────────────────────────────
function hav(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b[0]-a[0]), dLon = r(b[1]-a[1]);
  return R * 2 * Math.asin(Math.sqrt(Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2));
}

function nearestNeighbor(arr) {
  if (arr.length <= 1) return arr;
  const visited = new Set([0]), result = [arr[0]];
  while (result.length < arr.length) {
    const last = result[result.length-1];
    let bi = -1, bd = Infinity;
    arr.forEach((p,i) => { if (visited.has(i)) return; const d = hav(last.coord,p.coord); if (d<bd){bd=d;bi=i;} });
    visited.add(bi); result.push(arr[bi]);
  }
  return result;
}

function kMeans(arr, k, iter=25) {
  k = Math.min(k, arr.length);
  // Init centroids spread out
  let cents = [arr[0].coord];
  for (let c=1;c<k;c++) {
    let best=null,bd=-1;
    arr.forEach(p => { const md=Math.min(...cents.map(ct=>hav(p.coord,ct))); if(md>bd){bd=md;best=p.coord;} });
    cents.push(best);
  }
  let clusters = [];
  for (let it=0;it<iter;it++) {
    clusters = Array.from({length:k}, ()=>[]);
    arr.forEach((p,pi) => {
      let bi=0,bd=Infinity;
      cents.forEach((ct,ci)=>{const d=hav(p.coord,ct);if(d<bd){bd=d;bi=ci;}});
      clusters[bi].push(pi);
    });
    clusters.forEach((cl,ci) => {
      if (!cl.length) return;
      cents[ci] = [cl.reduce((s,pi)=>s+arr[pi].coord[0],0)/cl.length, cl.reduce((s,pi)=>s+arr[pi].coord[1],0)/cl.length];
    });
  }
  return clusters.filter(cl=>cl.length>0).map(cl=>cl.map(pi=>arr[pi]));
}

// ─── ROUTE COMPUTE ────────────────────────────────────────────────────────────
function estimateLegs(stops) {
  let dist=0; const legs=[];
  for(let i=0;i<stops.length-1;i++){
    const d=hav(stops[i].coord,stops[i+1].coord)*1.35;
    legs.push({dist:d,min:d/60*60}); dist+=d;
  }
  return {dist,min:dist/60*60,legs,geo:null};
}

async function computeOSRM(stops) {
  const est = estimateLegs(stops);
  if (stops.length < 2) return est;
  try {
    const cs = stops.map(s=>`${s.coord[1]},${s.coord[0]}`).join(';');
    const url = `https://router.project-osrm.org/route/v1/driving/${cs}?overview=full&geometries=geojson&steps=false`;
    const res = await fetch(url, {signal: AbortSignal.timeout(5000)});
    if (!res.ok) throw 0;
    const d = await res.json();
    if (d.code==='Ok' && d.routes[0]) {
      const r = d.routes[0];
      return {
        dist: r.distance/1000,
        min: r.duration/60,
        legs: r.legs.map(l=>({dist:l.distance/1000,min:l.duration/60})),
        geo: r.geometry.coordinates.map(c=>[c[1],c[0]])
      };
    }
  } catch(e) {}
  return est;
}

// ─── NAME ROUTE ───────────────────────────────────────────────────────────────
function nameRoute(stops) {
  const cities = stops.map(s => {
    const up = s.name.toUpperCase();
    for (const k of Object.keys(KC)) { if (up.includes(k)) return k.split(' ').map(w=>w[0]+w.slice(1).toLowerCase()).join(' '); }
    return s.name.split(/[\-,]/)[0].trim();
  });
  const freq = {};
  cities.forEach(c => freq[c]=(freq[c]||0)+1);
  return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]).join(' + ');
}

// ─── BUILD ROUTES ─────────────────────────────────────────────────────────────
async function buildRoutes(clusters) {
  rts = [];
  clearLayers();
  document.getElementById('spin2').classList.add('on');
  document.getElementById('spin-wrap').classList.add('on');

  for (let ci=0; ci<clusters.length; ci++) {
    if (!clusters[ci].length) continue;
    const stops = nearestNeighbor(clusters[ci]);
    const {dist,min,legs,geo} = await computeOSRM(stops);
    rts.push({ name: nameRoute(stops), color: COLORS[ci%COLORS.length], stops, totalDist: dist, totalTime: min, legs, geo });
  }

  document.getElementById('spin2').classList.remove('on');
  document.getElementById('spin-wrap').classList.remove('on');

  const total = rts.reduce((s,r)=>s+r.totalDist,0);
  document.getElementById('s-rot').textContent = rts.length;
  document.getElementById('s-km').textContent = total.toFixed(0);
  document.getElementById('btn-export').classList.remove('hide');
  document.getElementById('hdr-mid').textContent = `${rts.length} rotas · ${total.toFixed(0)} km total`;

  renderCards();
  renderMap();
}

function autoRoute() {
  const good = pts.filter(p=>p.ok);
  if (!good.length) return;
  const k = parseInt(document.getElementById('n-routes').value) || 3;
  buildRoutes(kMeans(good, k));
}

function splitRoute() {
  const good = pts.filter(p=>p.ok);
  if (!good.length) return;
  const k = parseInt(document.getElementById('n-routes').value) || 3;
  const sorted = [...good].sort((a,b)=>(a.coord[0]+a.coord[1])-(b.coord[0]+b.coord[1]));
  const size = Math.ceil(sorted.length/k);
  const clusters = [];
  for (let i=0;i<sorted.length;i+=size) clusters.push(sorted.slice(i,i+size));
  buildRoutes(clusters);
}

// ─── RENDER CARDS ─────────────────────────────────────────────────────────────
function hhmm(m) { return `${Math.floor(m/60)}h${String(Math.round(m%60)).padStart(2,'0')}min`; }

function renderCards() {
  const scroll = document.getElementById('rscroll');
  if (!rts.length) {
    scroll.innerHTML = '<div class="empty"><div class="empty-ico">🗺</div><div>Clique em "Auto região" ou "Dividir N"</div></div>';
    return;
  }

  // Preserve open state
  const open = {};
  rts.forEach((_,i) => { const el = document.getElementById(`rc-${i}`); open[i] = el ? el.classList.contains('open') : true; });

  scroll.innerHTML = rts.map((r,i) => `
    <div class="rcard ${open[i]!==false?'open':''}" id="rc-${i}">
      <div class="rcard-hdr" style="border-left-color:${r.color}" onclick="toggleCard(${i})">
        <div class="rcard-hl">
          <span class="rcard-arrow">${open[i]!==false?'▾':'▸'}</span>
          <div class="rcard-info">
            <div class="rcard-name" style="color:${r.color}">ROTA ${i+1} — ${r.name.toUpperCase()}</div>
            <div class="rcard-meta">${r.stops.length} paradas · <b>${r.totalDist.toFixed(0)} km</b> · ${hhmm(r.totalTime)}</div>
          </div>
        </div>
        <button class="maps-btn" style="border:1px solid ${r.color};color:${r.color}" onclick="event.stopPropagation();openMaps(${i})">↗ Maps</button>
      </div>
      <div class="rcard-body">
        <ul class="stop-list" id="sl-${i}">
          ${r.stops.map((s,si) => stopHTML(s,si,i,r)).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  rts.forEach((_,i) => attachDrag(i));
}

function stopHTML(s, si, ri, r) {
  const leg = r.legs[si];
  const last = si === r.stops.length-1;
  const dist = !last && leg ? `→ ${leg.dist.toFixed(1)}km` : (last ? '🏁' : '');
  return `<li class="stop" draggable="true" data-ri="${ri}" data-si="${si}">
    <span class="stop-drag">⠿</span>
    <span class="stop-num" style="background:${r.color}">${si+1}</span>
    <span class="stop-name" title="${s.name}">${s.name}</span>
    <span class="stop-dist">${dist}</span>
    <button class="stop-rm" onclick="removeStop(${ri},${si})">✕</button>
  </li>`;
}

function toggleCard(i) {
  const el = document.getElementById(`rc-${i}`);
  if (!el) return;
  el.classList.toggle('open');
  el.querySelector('.rcard-arrow').textContent = el.classList.contains('open') ? '▾' : '▸';
}

function removeStop(ri, si) {
  rts[ri].stops.splice(si,1);
  if (!rts[ri].stops.length) rts.splice(ri,1);
  else { const e=estimateLegs(rts[ri].stops); rts[ri].totalDist=e.dist; rts[ri].totalTime=e.min; rts[ri].legs=e.legs; }
  renderCards(); renderMap();
}

// ─── DRAG & DROP ──────────────────────────────────────────────────────────────
function attachDrag(ri) {
  const list = document.getElementById(`sl-${ri}`);
  if (!list) return;
  let src = null;

  list.querySelectorAll('.stop').forEach(el => {
    el.addEventListener('dragstart', e => { src=el; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend',   () => { el.classList.remove('dragging'); list.querySelectorAll('.stop').forEach(x=>x.classList.remove('dragover')); });
    el.addEventListener('dragover',  e => { e.preventDefault(); list.querySelectorAll('.stop').forEach(x=>x.classList.remove('dragover')); el.classList.add('dragover'); });
    el.addEventListener('drop', e => {
      e.preventDefault();
      if (!src || src===el) return;
      const from = +src.dataset.si, to = +el.dataset.si;
      const r = rts[ri];
      const [moved] = r.stops.splice(from,1);
      r.stops.splice(to,0,moved);
      const est = estimateLegs(r.stops);
      r.totalDist=est.dist; r.totalTime=est.min; r.legs=est.legs;
      renderCards(); renderMap();
      computeOSRM(r.stops).then(res=>{ r.totalDist=res.dist;r.totalTime=res.min;r.legs=res.legs;r.geo=res.geo; renderCards();renderMap(); });
    });
  });
}

// ─── MAP RENDER ───────────────────────────────────────────────────────────────
function renderMap() {
  clearLayers();
  const leg = document.getElementById('legend');
  if (!rts.length) { leg.style.display='none'; return; }

  leg.style.display = 'flex';
  leg.innerHTML = rts.map((r,i) => `<div class="leg-row"><div class="leg-dot" style="background:${r.color}"></div>Rota ${i+1} — ${r.name.split('+')[0].trim()}</div>`).join('');

  const all = [];
  rts.forEach((r,ri) => {
    // Line
    if (r.geo && r.geo.length>1) {
      layers.push(L.polyline(r.geo,{color:r.color,weight:4,opacity:.8}).addTo(map));
    } else {
      layers.push(L.polyline(r.stops.map(s=>s.coord),{color:r.color,weight:3,opacity:.6,dashArray:'7,4'}).addTo(map));
    }
    // Markers
    r.stops.forEach((s,si) => {
      all.push(s.coord);
      const ico = L.divIcon({
        className:'',
        html:`<div style="width:22px;height:22px;border-radius:50%;background:${r.color};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:9px;font-weight:700;color:#fff">${si+1}</div>`,
        iconSize:[22,22],iconAnchor:[11,11]
      });
      const mk = L.marker(s.coord,{icon:ico}).addTo(map);
      mk.bindPopup(`<b>Rota ${ri+1} · Parada ${si+1}</b><br>${s.name}`);
      mk.on('click',()=>{ const card=document.getElementById(`rc-${ri}`); if(card&&!card.classList.contains('open'))toggleCard(ri); card&&card.scrollIntoView({behavior:'smooth',block:'nearest'}); });
      layers.push(mk);
    });
  });
  if (all.length) map.fitBounds(L.latLngBounds(all),{padding:[40,40]});
}

// ─── GOOGLE MAPS ──────────────────────────────────────────────────────────────
function openMaps(ri) {
  const addrs = rts[ri].stops.map(s=>encodeURIComponent(s.name+', São Paulo, Brasil'));
  if (addrs.length<2) return;
  window.open(`https://www.google.com/maps/dir/${addrs.join('/')}`, '_blank');
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function exportTxt() {
  const lines = [`ROTEIRIZADOR — ${new Date().toLocaleDateString('pt-BR')}`, '='.repeat(50)];
  rts.forEach((r,i) => {
    lines.push('', `ROTA ${i+1} — ${r.name.toUpperCase()}`, `${r.stops.length} paradas | ${r.totalDist.toFixed(1)} km | ${hhmm(r.totalTime)}`, '-'.repeat(35));
    r.stops.forEach((s,si)=>{ const l=r.legs[si]; lines.push(`  ${si+1}. ${s.name}${l?`  (→ ${l.dist.toFixed(1)}km)`:''}`); });
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));
  a.download=`rotas_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}

// ─── RESET ────────────────────────────────────────────────────────────────────
function resetAll() {
  pts=[]; rts=[]; clearLayers();
  document.getElementById('addr-input').value='';
  document.getElementById('line-count').textContent='0 linhas';
  document.getElementById('preview').innerHTML='';
  document.getElementById('btn-proc').disabled=true;
  document.getElementById('rscroll').innerHTML='<div class="empty"><div class="empty-ico">🗺</div><div>Clique em "Auto região" ou "Dividir N"</div></div>';
  document.getElementById('legend').style.display='none';
  document.getElementById('btn-reset').classList.add('hide');
  document.getElementById('btn-export').classList.add('hide');
  document.getElementById('btn-back').classList.add('hide');
  document.getElementById('hdr-mid').textContent='Cole os endereços e gere as rotas';
  document.getElementById('s-pts').textContent='0';
  document.getElementById('s-rot').textContent='0';
  document.getElementById('s-km').textContent='—';
  document.getElementById('tab2').disabled=true;
  goStep(1);
  map.setView([-22.95,-47.0],9);
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),3000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // Init map
  initMap();

  // Textarea listener
  document.getElementById('addr-input').addEventListener('input', function() {
    const n = this.value.split('\n').filter(l=>l.trim().length>1).length;
    document.getElementById('line-count').textContent = n + ' linhas';
    document.getElementById('btn-proc').disabled = n === 0;
    document.getElementById('preview').innerHTML = '';
  });
});
</script>
